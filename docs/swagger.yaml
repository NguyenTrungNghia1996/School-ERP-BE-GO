info:
  contact: {}
  description: REST API for School ERP
  title: School ERP API
  version: "1.0"
paths:
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Check API, database and Redis health
      tags:
      - Health
  /v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: subdomain, identifier (email/username/phone), password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.TenantLoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.TenantLoginOutput'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Đăng nhập người dùng Đơn vị / Trường học (Tenant)
      tags:
      - Tenant Auth
  /v1/auth/logout:
    post:
      parameters:
      - description: Subdomain của Đơn vị (tùy chọn, mặc định tự lấy org_id từ JWT)
        in: header
        name: X-Tenant-Subdomain
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
      security:
      - BearerAuth: []
      summary: Đăng xuất phiên người dùng Đơn vị
      tags:
      - Tenant Auth
  /v1/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: refresh_token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.TenantRefreshInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.TenantLoginOutput'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Làm mới Access Token Tenant
      tags:
      - Tenant Auth
  /v1/auth/switch-school:
    post:
      consumes:
      - application/json
      parameters:
      - description: Subdomain của Đơn vị (tùy chọn, mặc định tự lấy org_id từ JWT)
        in: header
        name: X-Tenant-Subdomain
        type: string
      - description: school_id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.SwitchSchoolInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.TenantLoginOutput'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Chuyển đổi trường học đang thao tác trong cùng 1 Đơn vị
      tags:
      - Tenant Auth
  /v1/iam/entitled-permissions:
    get:
      parameters:
      - description: Subdomain của Đơn vị (tùy chọn, mặc định tự lấy org_id từ JWT)
        in: header
        name: X-Tenant-Subdomain
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/iam.EntitledPermissionItem'
                  type: array
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Danh sách quyền từ Catalog mà Đơn vị được phép dùng theo gói dịch vụ
      tags:
      - Tenant IAM
  /v1/iam/members:
    get:
      parameters:
      - description: Subdomain của Đơn vị (tùy chọn, mặc định tự lấy org_id từ JWT)
        in: header
        name: X-Tenant-Subdomain
        type: string
      - description: School ID đang chọn
        in: header
        name: X-School-ID
        type: string
      - description: Tìm kiếm
        in: query
        name: search
        type: string
      - description: Trạng thái (ACTIVE, SUSPENDED, INACTIVE)
        in: query
        name: status
        type: string
      - description: Trang
        in: query
        name: page
        type: integer
      - description: Số lượng mỗi trang
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessListResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/iam.SchoolMembership'
                  type: array
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Danh sách thành viên thuộc trường hiện tại
      tags:
      - Tenant IAM
    post:
      consumes:
      - application/json
      parameters:
      - description: Subdomain của Đơn vị (tùy chọn, mặc định tự lấy org_id từ JWT)
        in: header
        name: X-Tenant-Subdomain
        type: string
      - description: School ID đang chọn
        in: header
        name: X-School-ID
        type: string
      - description: Thông tin thành viên
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/iam.CreateMemberInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/iam.SchoolMembership'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Thêm thành viên vào trường (tái sử dụng user nếu email/phone đã tồn
        tại - Single Account Identity)
      tags:
      - Tenant IAM
  /v1/iam/members/{membership_id}/roles:
    put:
      consumes:
      - application/json
      parameters:
      - description: Subdomain của Đơn vị (tùy chọn, mặc định tự lấy org_id từ JWT)
        in: header
        name: X-Tenant-Subdomain
        type: string
      - description: Membership ID
        in: path
        name: membership_id
        required: true
        type: string
      - description: Danh sách role_ids
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/iam.UpdateMemberRolesInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cập nhật danh sách vai trò của thành viên (chống gỡ SCHOOL_ADMIN cuối
        cùng)
      tags:
      - Tenant IAM
  /v1/iam/members/{membership_id}/status:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Subdomain của Đơn vị (tùy chọn, mặc định tự lấy org_id từ JWT)
        in: header
        name: X-Tenant-Subdomain
        type: string
      - description: Membership ID
        in: path
        name: membership_id
        required: true
        type: string
      - description: status, reason
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/iam.UpdateMemberStatusInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
